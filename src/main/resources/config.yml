    diagonal-leaves: false

  poplar:
    logs:
      - POPLAR_LOG
      - STRIPPED_POPLAR_LOG
      - POPLAR_WOOD
      - STRIPPED_POPLAR_WOOD
    leaves:
      - YELLOW_POPLAR_LEAVES
      - ORANGE_POPLAR_LEAVES
      - RED_POPLAR_LEAVES
    sapling: POPLAR_SAPLING
    branch-radius: 2
    leaf-radius: 4
    diagonal-leaves: false
